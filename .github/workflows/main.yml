name: COMPILAR APK FALHA UNIVERSO V1.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Conferir estrutura
        shell: bash
        run: |
          echo "======================================"
          echo "FALHA UNIVERSO 8 / 9 / 10 - V1.5"
          echo "ROTEAMENTO 8 -> 8 | 9 -> 9 | 10 -> 10"
          echo "======================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/br/com/falhauniverso/oitonovedez/CoreEngine.java
          test -f app/src/main/java/br/com/falhauniverso/oitonovedez/MainActivity.java
          test -f app/src/main/java/br/com/falhauniverso/oitonovedez/StableAnalysisService.java

          echo "ESTRUTURA OK"

      - name: Verificar roteamento 8 9 10
        shell: bash
        run: |
          grep -F 'm8.setOnClickListener(v->startStableService(8));' \
          app/src/main/java/br/com/falhauniverso/oitonovedez/MainActivity.java

          grep -F 'm9.setOnClickListener(v->startStableService(9));' \
          app/src/main/java/br/com/falhauniverso/oitonovedez/MainActivity.java

          grep -F 'm10.setOnClickListener(v->startStableService(10));' \
          app/src/main/java/br/com/falhauniverso/oitonovedez/MainActivity.java

          echo "ROTEAMENTO 8 / 9 / 10 OK"

      - name: Mostrar versoes
        run: |
          java -version
          gradle --version

      - name: Limpar compilacao anterior
        run: |
          gradle --stop || true
          rm -rf app/build
          rm -rf .gradle

      - name: Compilar APK
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p apk-final

          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK NAO ENCONTRADO"
            exit 1
          fi

          cp "$APK" \
          apk-final/FALHA-UNIVERSO-8-9-10-V1.5.apk

          echo "======================================"
          echo "APK V1.5 PRONTO"
          echo "======================================"

          ls -lh apk-final/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: FALHA-UNIVERSO-8-9-10-V1.5
          path: apk-final/FALHA-UNIVERSO-8-9-10-V1.5.apk
          if-no-files-found: error
          retention-days: 30
